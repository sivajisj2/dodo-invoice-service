services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dodo_payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dodo_payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock-psp:
    build: .
    command: ["mock-psp"]
    environment:
      MOCK_PSP_HOST: 0.0.0.0
      MOCK_PSP_PORT: 9000
      RUST_LOG: info
    ports:
      - "9000:9000"

  api:
    build: .
    command: ["dodo-invoice-service"]
    depends_on:
      db:
        condition: service_healthy
      mock-psp:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/dodo_payments
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      MOCK_PSP_URL: http://mock-psp:9000
      MOCK_PSP_HOST: mock-psp
      MOCK_PSP_PORT: 9000
      RUST_LOG: info
    ports:
      - "8080:8080"

volumes:
  postgres_data:
